services:
  mydaily:
    container_name: mydaily          # 容器运行后的名称
    build: .                         # 从当前目录 Dockerfile 构建镜像
    image: mydaily:latest            # 手动指定镜像的仓库名+标签
    ports:
      - "5555:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # ⚠️ 必填项：未设置 MYDAILY_PASSWORD 时容器会启动失败。
      # 生成强密码：python3 -c "import secrets; print(secrets.token_hex(16))"
      - MYDAILY_PASSWORD=${MYDAILY_PASSWORD:-}
      # ⚠️ 必填项：Token 签名密钥，未设置时容器会启动失败。
      # 生成密钥：python3 -c "import secrets; print(secrets.token_hex(32))"
      - MYDAILY_SECRET_KEY=${MYDAILY_SECRET_KEY:-}
      # 仅本地信任环境可设为 true 以禁用认证（生产绝不可用）
      # - MYDAILY_AUTH_DISABLED=true
      # Token 有效期（秒），默认 30 天
      # - MYDAILY_TOKEN_TTL_SECONDS=2592000
      # CORS 允许源（逗号分隔）
      # - MYDAILY_CORS_ORIGINS=https://your-domain.example.com
    volumes:
      - mydaily-db:/app/data
    restart: unless-stopped          # 容器崩溃自动重启（手动停止后不重启）
    networks:
      - mydaily-net
    # 资源限制：避免单容器吃满宿主机资源
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # 日志轮转：避免日志撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mydaily-db:

networks:
  mydaily-net:
