services:
  mydaily:
    container_name: mydaily          # 容器运行后的名称
    build: .                         # 从当前目录Dockerfile构建镜像
    image: mydaily:latest              # ✅ 手动指定镜像的仓库名+标签，核心配置
    ports:
      - "5555:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Set MYDAILY_PASSWORD to override the default authentication password
      # - MYDAILY_PASSWORD=your-secure-password
    volumes:
      - mydaily-db:/app/data
    restart: always                  # 容器崩溃自动重启，高可用
    networks:
      - mydaily-net

volumes:
  mydaily-db:

networks:
  mydaily-net: